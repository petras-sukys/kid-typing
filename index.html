<html>
<head>
<script type="text/javascript" src="jquery-3.7.1.min.js"></script>
<script type="text/javascript">
document.onkeypress = checkKeycode;

function hashCode(str) { // java String#hashCode
    var hash = 0;
    for (var i = 0; i < str.length; i++) {
       hash = str.charCodeAt(i) + ((hash << 5) - hash);
    }
    return hash;
} 

function intToRGBFromIndex(i){
    var PALETTE = [
        "#4c5a69", "#7d8fb3", "#9da4bd", "#ad9cd1", "#bedde1", "#ccbefe",
        "#a8afff", "#c39eff", "#eeccba", "#db9fac", "#adb592", "#7c9aac", 
        "#a9baff", "#d6abeb", "#b8adcf", "#edccef"
    ];
    return PALETTE[i & 0xF] || "#cccccc";
}

    var audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playNote(keycode) {
        var oscillator = audioCtx.createOscillator();
        var gainNode = audioCtx.createGain();
        oscillator.type = 'sine';
        var freq = 261.63 * Math.pow(2, (keycode - 60) / 12);
        if (!(freq > 0)) freq = 440;
        oscillator.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        oscillator.start();
        oscillator.stop(audioCtx.currentTime + 0.5);
    }

    function checkKeycode(e) {
        if (typeof window.AudioContext !== 'undefined') {
            // Resume context if it was suspended by browser policy
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }
        var keycode;
        if (window.event) {
            keycode = window.event.keyCode;
        }
        else if (e) keycode = e.which;

        var character = String.fromCharCode(keycode);
        playNote(keycode);

        var letterDiv = document.getElementById("letter1");
		if (character != " ")
			letterDiv.innerHTML += character.toUpperCase();
		else
			letterDiv.innerHTML = character.toUpperCase(); 
		var hash = hashCode(letterDiv.innerHTML);
		console.log("hash: " + hash);
		var color = intToRGBFromIndex(hashCode("key" + keycode) & 0xF);
		console.log("color: " + color);
		document.body.style.color = color;
    }
</script>
<style type="text/css">
#letter1
{
font-size: 500px;
padding: 300px;
color: #CCCCCC;
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
}
body {
	text-align: center;
	background-color: #333333
}
</style>
<title>Kid Typing</title></head>
<div id='letter1'></div>
<body>
</body>
</html>
