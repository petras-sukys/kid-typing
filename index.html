<html>
<head>
<script type="text/javascript" src="jquery-3.7.1.min.js"></script>
<script type="text/javascript">
document.onkeypress = checkKeycode;

function hashCode(str) { // java String#hashCode
    var hash = 0;
    for (var i = 0; i < str.length; i++) {
       hash = str.charCodeAt(i) + ((hash << 5) - hash);
    }
    return hash;
} 

function intToRGB(i){
    var PALETTE = [
        "#5d6d7e", "#8ca4be", "#aeb6e0", "#b39edb", "#cecce2", "#d7c2f5",
        "#bcbdff", "#daaeef", "#fee1cc", "#df9bb0", "#bdcaae", "#84abb0", 
        "#aec4fe", "#e9a6ba", "#c5b9dd", "#f3dcf2"
    ];
    return PALETTE[i & 0xF] || "#cccccc";
}

    var audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playNote(keycode) {
        var oscillator = audioCtx.createOscillator();
        var gainNode = audioCtx.createGain();
        oscillator.type = 'sine';
        var freq = 261.63 * Math.pow(2, (keycode - 60) / 12);
        if (!(freq > 0)) freq = 440;
        oscillator.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        oscillator.start();
        oscillator.stop(audioCtx.currentTime + 0.5);
    }

    function checkKeycode(e) {
        if (typeof window.AudioContext !== 'undefined') {
            // Resume context if it was suspended by browser policy
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }
        var keycode;
        if (window.event) {
            keycode = window.event.keyCode;
        }
        else if (e) keycode = e.which;

        var character = String.fromCharCode(keycode);
        playNote(keycode);

        var letterDiv = document.getElementById("letter1");
		if (character != " ")
			letterDiv.innerHTML += character.toUpperCase();
		else
			letterDiv.innerHTML = character.toUpperCase(); 
		var hash = hashCode(letterDiv.innerHTML);
		console.log("hash: " + hash);
		var bg_color = intToRGB(hashCode("key" + keycode) & 0xF);
		console.log("bg_color: " + bg_color);
		document.body.style.backgroundColor = bg_color;
    }
</script>
<style type="text/css">
#letter1
{
font-size: 500px;
padding: 300px;
color: #CCCCCC;
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
}
body {
	text-align: center;
	background-color: #333333
}
</style>
<title>Kid Typing</title></head>
<div id='letter1'></div>
<body>
</body>
</html>
